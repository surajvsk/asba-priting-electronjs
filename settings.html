<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-container"></div> <!-- Navbar will load here -->
<div class="container mt-5">
  <h2>Settings</h2>

  <div class="mb-3">
    <label for="input-path" class="form-label">Input Folder Path</label>
    <div class="input-group">
      <input type="text" class="form-control" id="input-path" placeholder="Select input folder">
      <button class="btn btn-secondary" id="browse-input">Browse</button>
    </div>
  </div>

  <div class="mb-3">
    <label for="output-path" class="form-label">Output Folder Path</label>
    <div class="input-group">
      <input type="text" class="form-control" id="output-path" placeholder="Select output folder">
      <button class="btn btn-secondary" id="browse-output">Browse</button>
    </div>
  </div>

  <button class="btn btn-primary" id="save-settings">Save Settings</button>
  <div id="status" class="mt-3 text-success"></div>
</div>



    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/jquery-3.7.1.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<script>
  const inputPathEl = document.getElementById('input-path');
  const outputPathEl = document.getElementById('output-path');
  const statusEl = document.getElementById('status');

  document.getElementById('browse-input').addEventListener('click', async () => {
    const path = await window.electronAPI.selectFolder();
    if (path) inputPathEl.value = path;
  });

  document.getElementById('browse-output').addEventListener('click', async () => {
    const path = await window.electronAPI.selectFolder();
    if (path) outputPathEl.value = path;
  });

  document.getElementById('save-settings').addEventListener('click', async () => {
    if (!inputPathEl.value || !outputPathEl.value) {
      alert('Please select both input and output paths');
      return;
    }

    await window.electronAPI.saveSettings({
      inputPath: inputPathEl.value,
      outputPath: outputPathEl.value
    });

    statusEl.textContent = 'Settings saved successfully!';
  });

  // Load existing settings
  window.electronAPI.getSettings().then(settings => {
    if (settings) {
      inputPathEl.value = settings.inputPath || '';
      outputPathEl.value = settings.outputPath || '';
    }
  });
</script>
</body>
</html>
