<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERNET Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        /* New color variables for the white theme */
        :root {
            --light-bg: #f0f0f0;
            --light-form-bg: #ffffff;
            --main-accent: #007bff; /* A bright blue for contrast */
            --secondary-accent: #ff4500; /* An orange for the glitch effect */
            --font-color: #333333;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            color: var(--font-color);
            background: var(--light-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Background grid effect - adapted for a light theme */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(to right, rgba(0, 123, 255, 0.1) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 69, 0, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-pulse 5s infinite ease-in-out;
            opacity: 0.2;
        }

        @keyframes grid-pulse {
            0%, 100% { background-size: 50px 50px; }
            50% { background-size: 48px 48px; }
        }

        .login-container {
            background: var(--light-form-bg);
            backdrop-filter: blur(5px);
            border: 2px solid var(--main-accent);
            box-shadow: 0 0 40px rgba(0, 123, 255, 0.3), inset 0 0 20px rgba(255, 69, 0, 0.2);
            padding: 3rem;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            animation: fade-in 1.5s ease-out;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .glitch {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 5px;
            position: relative;
            color: var(--main-accent);
            text-shadow: 0 0 5px var(--main-accent), 0 0 20px var(--secondary-accent);
            animation: glitch-anim 2s infinite linear alternate;
        }

        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch::before {
            left: -2px;
            text-shadow: 0 0 5px var(--secondary-accent), 0 0 20px var(--secondary-accent);
            clip-path: inset(0 0 50% 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: 2px;
            text-shadow: 0 0 5px var(--main-accent), 0 0 20px var(--main-accent);
            clip-path: inset(50% 0 0 0);
            animation: glitch-anim-3 4s infinite linear alternate;
        }
        
        @keyframes glitch-anim {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 5px); }
            40% { transform: translate(-5px, -5px); }
            60% { transform: translate(5px, 5px); }
            80% { transform: translate(5px, -5px); }
            100% { transform: translate(0); }
        }

        @keyframes glitch-anim-2 {
            0% { transform: translate(0); }
            20% { transform: translate(2px, 2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-2px, 2px); }
            80% { transform: translate(-2px, -2px); }
            100% { transform: translate(0); }
        }

        @keyframes glitch-anim-3 {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .subtitle {
            color: #555;
            margin-top: 0;
            margin-bottom: 2rem;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .input-group {
            position: relative;
            margin-bottom: 2rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 1rem;
            color: var(--main-accent);
            text-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
        }

        .input-group input {
            width: 100%;
            padding: 10px 0;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--secondary-accent);
            outline: none;
            color: var(--font-color);
            font-size: 1.1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .input-group input:focus {
            border-bottom: 2px solid var(--main-accent);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
        }

        .glitch-btn {
            background: var(--main-accent);
            color: var(--light-form-bg);
            border: none;
            padding: 15px 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, background-color 0.3s ease;
            border-radius: 5px;
            box-shadow: 0 0 15px var(--main-accent);
        }

        .glitch-btn:hover {
            transform: translateY(-3px);
            background: var(--secondary-accent);
            box-shadow: 0 0 15px var(--secondary-accent);
        }

        .links {
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
        }

        .links a {
            color: var(--main-accent);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .links a:hover {
            color: var(--secondary-accent);
            text-shadow: 0 0 10px var(--secondary-accent);
        }

        .error-message {
            color: var(--secondary-accent);
            margin-top: 1rem;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-message.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-form-box">
            <h1 class="glitch" data-text="CYBERNET">CYBERNET</h1>
            <p class="subtitle">Secure connection established.</p>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">User ID</label>
                    <input type="text" id="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Access Key</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="glitch-btn">
                    <span class="glitch-btn-text">INITIATE LOGIN</span>
                </button>
            </form>
            <div class="links">
                <a href="#">Forgot Access Key?</a>
                <a href="#">Register New User</a>
            </div>
            <div id="message" class="error-message"></div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            const validUsername = 'admin';
            const validPassword = 'admin';

            if (usernameInput === validUsername && passwordInput === validPassword) {
                messageDiv.textContent = 'Login successful! Redirecting...';
                messageDiv.classList.add('visible');
                messageDiv.style.color = 'var(--main-accent)';

                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 1500);
            } else {
                messageDiv.textContent = 'Invalid User ID or Access Key. Access denied.';
                messageDiv.classList.add('visible');
                messageDiv.style.color = 'var(--secondary-accent)';
            }
        });
    </script>
</body>
</html>
