<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart ASBA</title>
 <link rel="stylesheet" href="assets/css/index.css">
</head>
<body>
<div class="login-container">
        <div class="login-form-box">
            <h1 class="glitcha" data-text="Smart ASBA">Smart ASBA</h1>
            <p class="subtitle">Secure connection established.</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" value="admin" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" value="admin" required>
                </div>
                <button type="submit" class="glitch-btn">
                    <span class="glitch-btn-text">INITIATE LOGIN</span>
                </button>
            </form>

            <div class="links">
                <a href="#">Forgot Access Key?</a>
                <a href="#">Register New User</a>
            </div>

            <div id="message" class="error-message"></div>
        </div>

        <!-- ✅ Footer section -->
        <div class="footer">
           <span class="brand">Dynamite Technology Private Limited</span>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            const validUsername = 'admin';
            const validPassword = 'admin';

            if (usernameInput === validUsername && passwordInput === validPassword) {
                messageDiv.textContent = 'Login successful! Redirecting...';
                messageDiv.classList.add('visible');
                messageDiv.style.color = 'var(--main-accent)';

                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 1500);
            } else {
                messageDiv.textContent = 'Invalid User ID or Access Key. Access denied.';
                messageDiv.classList.add('visible');
                messageDiv.style.color = 'var(--secondary-accent)';
            }
        });
    </script>
</body>
</html>
