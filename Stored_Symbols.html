<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Symbol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/common.css">
    <style>
      #overlay-data-table th, #overlay-data-table td {
        vertical-align: middle;
      }
      td.pointer {
        cursor: pointer;
        color: #0d6efd;
      }
      td.pointer:hover {
        text-decoration: underline;
      }
      button.delete-btn {
        padding: 2px 8px;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div id="navbar-container"></div> <!-- Navbar will load here -->

    <div class="container mt-4">
      <div class="card mb-4 shadow-sm">
        <div class="card-header bg-dark text-white">
          <h5 class="mb-0">Stored Symbols</h5>
        </div>
        <div class="card-body p-0">
          <table class="table table-hover table-striped mb-0">
            <thead class="table-dark">
              <tr>
                <th>#</th>
                <th>Symbol Key</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="key-table-body">
              <tr><td colspan="3" class="text-center">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white d-flex justify-content-between">
         <div> <h5 class="mb-0">Overlay Data</h5></div>
         <div>
          <!-- DOWNLOAD excel -->
          <button id="download-excel" class="btn btn-sm btn-light">Download Excel</button>
        </div>
        </div>
        <div class="card-body p-3">
          <div id="no-data-msg" class="text-muted">Click a symbol key to view overlay data</div>
          <div class="table-responsive">
            <table class="table table-bordered table-sm mt-2 d-none" id="overlay-data-table">
              <thead class="table-light">
                <tr>
                  <th>#</th>
                  <th>Key</th>
                  <th>Value</th>
                  <th>X</th>
                  <th>Y</th>
                  <th>Font Size</th>
                  <th>Letter Spacing</th>
                </tr>
              </thead>
              <tbody id="overlay-data-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/jquery-3.7.1.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script>
      let currentSymbolKey = null;
      async function loadKeys() {
        try {
          const keys = await window.electronAPI.getAllKeys();
          const tbody = document.getElementById('key-table-body');
          tbody.innerHTML = '';

          if (keys.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="text-center">No keys stored</td></tr>';
          } else {
            keys.forEach((key, index) => {
              const tr = document.createElement('tr');

              const tdIndex = document.createElement('td');
              tdIndex.textContent = index + 1;

              const tdKey = document.createElement('td');
              tdKey.textContent = key;
              tdKey.classList.add('pointer');

                tdKey.addEventListener('click', async () => {
                  try {
                    const data = await window.electronAPI.getItem(key);
                    displayOverlayData(data);
                    currentSymbolKey = key; // <-- track current symbol
                  } catch (err) {
                    console.error('Error fetching key data:', err);
                  }
                });

              const tdActions = document.createElement('td');
              const deleteBtn = document.createElement('button');
              deleteBtn.textContent = 'Delete';
              deleteBtn.classList.add('btn', 'btn-sm', 'btn-danger', 'delete-btn');

              deleteBtn.addEventListener('click', async () => {
                const confirmDelete = confirm(`Are you sure you want to delete key "${key}"?`);
                if (!confirmDelete) return;

                try {
                  await window.electronAPI.removeItem(key);
                  alert(`Key "${key}" deleted successfully!`);
                  loadKeys();
                  document.getElementById('overlay-data-table').classList.add('d-none');
                  document.getElementById('no-data-msg').textContent = 'Click a symbol key to view overlay data';
                } catch (err) {
                  console.error('Error deleting key:', err);
                }
              });

              tdActions.appendChild(deleteBtn);
              tr.appendChild(tdIndex);
              tr.appendChild(tdKey);
              tr.appendChild(tdActions);
              tbody.appendChild(tr);
            });
          }
        } catch (err) {
          console.error('Error loading keys:', err);
        }
      }

      function displayOverlayData(data) {
        const noDataMsg = document.getElementById('no-data-msg');
        const table = document.getElementById('overlay-data-table');
        const tbody = document.getElementById('overlay-data-body');

        if (!data || !data.coordinates || data.coordinates.length === 0) {
          noDataMsg.textContent = 'No overlay data for this symbol.';
          table.classList.add('d-none');
          tbody.innerHTML = '';
          return;
        }

        noDataMsg.textContent = '';
        table.classList.remove('d-none');
        tbody.innerHTML = '';

        data.coordinates.forEach((item, index) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${index + 1}</td>
            <td>${item.key || '-'}</td>
            <td>${item.value || '-'}</td>
            <td>${item.x || '-'}</td>
            <td>${item.y || '-'}</td>
            <td>${item.fontSize || '-'}</td>
            <td>${item.letterSpacing || '-'}</td>
          `;
          tbody.appendChild(tr);
        });
      }



document.getElementById('download-excel').addEventListener('click', async () => {
  try {
    if (!currentSymbolKey) {
      alert('Please select a symbol to download Excel!');
      return;
    }

    const data = await window.electronAPI.getItem(currentSymbolKey);
    if (!data || !data.coordinates || data.coordinates.length === 0) {
      alert('No overlay data available for this symbol!');
      return;
    }

    const wb = XLSX.utils.book_new();

    // Create headers from overlay keys
    const headers = data.coordinates.map(item => item.key || 'UnnamedKey');
    // Create a single row of values
    const rowValues = data.coordinates.map(item => item.value || '');

    const wsData = [headers, rowValues]; // first row headers, second row values
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    XLSX.utils.book_append_sheet(wb, ws, currentSymbolKey);

    XLSX.writeFile(wb, `${currentSymbolKey}_Template.xlsx`);
    alert(`Excel template for "${currentSymbolKey}" downloaded successfully!`);
  } catch (err) {
    console.error('Error generating Excel:', err);
    alert('Error generating Excel. Check console.');
  }
});

      loadKeys();
    </script>
  </body>
</html>
